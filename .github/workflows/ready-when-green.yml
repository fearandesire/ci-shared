name: ready-when-green

# Reusable workflow. Call it from a workflow_run stub in each repo (see caller.yml.tmpl).
# Marks a draft PR ready for review once every check on its current head commit is green.
on:
  workflow_call:
    inputs:
      runner:
        description: Runner label. Ubicloud by default; override only for a repo without Ubicloud.
        type: string
        default: ubicloud-standard-2
    secrets:
      READY_TOKEN:
        description: Optional PAT or App token. Needed only if ready_for_review workflows must fire.
        required: false

permissions: {}

jobs:
  ready:
    # Same-repo branches only; fork PRs and failed CI runs are skipped.
    # Filtering here (not in a step) keeps non-agent runs unbilled: skipped jobs cost no minutes.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (startsWith(github.event.workflow_run.head_branch, 'agent/') ||
       startsWith(github.event.workflow_run.head_branch, 'claude/') ||
       startsWith(github.event.workflow_run.head_branch, 'codex/'))
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write # gh pr ready fails with "Resource not accessible" without it (cli/cli#8910)
      pull-requests: write
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ secrets.READY_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      # Passed via env, never interpolated into the script: branch names are untrusted input.
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Mark green draft PRs ready
        shell: bash
        run: |
          set -euo pipefail
          # Ready only when: still draft, not labelled agent-needs-human, head is the commit
          # CI just ran on, and every check/status on that commit is complete and green.
          prs=$(gh pr list --head "$BRANCH" --state open --draft \
            --json number,headRefOid,labels --jq '
              .[]
              | select(.headRefOid == env.SHA)
              | select(all(.labels[].name; . != "agent-needs-human"))
              | .number')

          if [ -z "$prs" ]; then echo "nothing ready yet for $BRANCH @ ${SHA:0:7}"; exit 0; fi
          for n in $prs; do
            echo "checking #$n at ${SHA:0:7}"
            # gh's statusCheckRollup expansion reads checkSuite.workflowRun, requiring
            # Actions read. Ask only for check/status fields so existing callers keep
            # their original permission contract. Paginate: a late failing check must
            # not be hidden beyond the first 100 results.
            pages=$(gh api graphql --paginate \
              -F owner="${GH_REPO%/*}" -F name="${GH_REPO#*/}" -F number="$n" \
              -f query='
                query($owner: String!, $name: String!, $number: Int!, $endCursor: String) {
                  repository(owner: $owner, name: $name) {
                    pullRequest(number: $number) {
                      headRefOid isDraft
                      headRepository { nameWithOwner }
                      labels(first: 100) { nodes { name } labelPage: pageInfo { hasNextPage } }
                      commits(last: 1) { nodes { commit { statusCheckRollup {
                        contexts(first: 100, after: $endCursor) {
                          nodes {
                            ... on CheckRun { status conclusion }
                            ... on StatusContext { state }
                          }
                          pageInfo { hasNextPage endCursor }
                        }
                      } } } }
                    }
                  }
                }' --jq '
                .data.repository.pullRequest
                | (.commits.nodes[0].commit.statusCheckRollup.contexts.nodes // []) as $checks
                | (.isDraft == true)
                  and (.headRefOid == env.SHA)
                  and (.headRepository.nameWithOwner == env.GH_REPO)
                  and (.labels.labelPage.hasNextPage == false)
                  and all(.labels.nodes[].name; . != "agent-needs-human")
                  and ($checks | length > 0)
                  and all($checks[];
                    ((.status == "COMPLETED") and (.conclusion | IN("SUCCESS","NEUTRAL","SKIPPED")))
                    or .state == "SUCCESS")')
            if [ -z "$pages" ] || grep -qvx true <<< "$pages"; then
              echo "#$n is held, changed, or has unfinished/non-green checks"
              continue
            fi
            if [ "${DRY_RUN:-0}" = 1 ]; then
              echo "would mark #$n ready (dry run)"
            else
              gh pr ready "$n"
              echo "marked #$n ready"
            fi
          done
