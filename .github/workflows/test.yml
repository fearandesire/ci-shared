name: test
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  delayed-canary-check:
    if: startsWith(github.head_ref, 'agent/ready-canary-')
    runs-on: ubicloud-standard-2
    steps:
      - name: Deliberately finish after the promotion monitor starts
        run: sleep 60
      - name: Keep the external-check canary pending for another poll
        run: sleep 30
  test:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - name: Regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          bash -n rollout.sh
          python3 tests/test_ready.py --emit-script | bash -n
      - name: Read check states without Actions permission
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
          DRY_RUN: '1'
        run: python3 tests/test_ready.py --emit-script | bash -e -o pipefail
